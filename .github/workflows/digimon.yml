name: Update Digimon README

on:
  push:
    branches:
      - main
  schedule:
    # Se ejecuta automáticamente todos los días a las 12 PM UTC
    - cron: '0 12 * * *' 

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar el script
        run: python BakaNahu/update_digimon.py

      - name: Commitear los cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "¡Nuevos Digimons en el perfil! 💻" || exit 0
          git push
